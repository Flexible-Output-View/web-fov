name: Angular Tests

on:
  push:
    paths:
      - "fov-angular/**"
      - ".github/workflows/angular-tests.yml"
      - "codecov.yml"
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: fov-angular/package-lock.json

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies (reproducible)
        run: |
          cd fov-angular
          npm ci

      - name: Create environment file
        run: |
          mkdir -p fov-angular/src/environments
          cat > fov-angular/src/environments/environment.ts << 'EOF'
          export const environment = {
            apiUrl: 'http://localhost:4000/api',
          };
          EOF

      - name: Run tests with coverage
        env:
          CHROME_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
        run: |
          cd fov-angular
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/dev' && !github.event.repository.fork)
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: fov-angular/coverage/lcov.info
          flags: frontend
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fov-angular/coverage/
          if-no-files-found: warn
