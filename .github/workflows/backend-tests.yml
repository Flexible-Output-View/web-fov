name: Backend Tests & Lint

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
      - "codecov.yml"
  pull_request:
    branches: [main, dev]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: fovwebdb
          POSTGRES_USER: root
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d fovwebdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (reproducible)
        run: |
          cd backend
          npm ci

      - name: Load integration database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U root -d fovwebdb -f fovwebdb.sql

      - name: Run tests with coverage
        run: |
          cd backend
          npm run test:coverage

      - name: Run PostgreSQL integration tests
        env:
          RUN_INTEGRATION: "1"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: root
          DB_PASSWORD: postgres
          DB_NAME: fovwebdb
          JWT_SECRET: integration-test-secret
        run: |
          cd backend
          npm run test:integration

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/dev' && !github.event.repository.fork)
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: backend/coverage/lcov.info
          flags: backend
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          if-no-files-found: warn

      - name: Run linter
        run: |
          cd backend
          npm run lint
