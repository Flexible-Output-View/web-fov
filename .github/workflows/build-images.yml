name: Build & Push images
on:
  push:
    branches: [main, dev, 111-move-ci-to-github-hosted-runners-and-switch-deployment-to-pull-based-ghcr]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ghcr.io/flexible-output-view/fov-backend:${{ github.ref_name }}

      - uses: docker/build-push-action@v7
        with:
          context: fov-angular
          push: true
          tags: ghcr.io/flexible-output-view/fov-frontend:${{ github.ref_name }}