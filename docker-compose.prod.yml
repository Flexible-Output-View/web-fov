services:
  nginx:
    ports: !override []
    networks:
      - frontend
      - nginx-proxy-network

  backend:
    ports: !override
      - "0.0.0.0:9999-10010:9999-10010"
      - "0.0.0.0:9999-10010:9999-10010/udp"

  fov-db:
    ports: !override
      - "127.0.0.1:5432:5432"

networks:
  nginx-proxy-network:
    external: true
