services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./backend/media:/var/media:z
    ports:
      - "9999-10010:9999-10010"
      - "9999-10010:9999-10010/udp" # SRT
    networks:
      - frontend
      - backend
    depends_on:
      fov-db:
        condition: service_healthy
    environment:
      - PORT=4000
      - DB_HOST=fov-db
      - DB_PORT=5432
      - DB_USER=root
      - SRT_PORT=9999
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=fovwebdb
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - MEDIA_ROOT=/var/media
      - SRT_URL=${SRT_URL}
      - TWITCH_ID=${TWITCH_ID}
      - TWITCH_SECRET=${TWITCH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}

  frontend:
    build:
      context: ./fov-angular
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend

  fov-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    volumes:
      - fov-db:/var/lib/postgresql
      - ./fovwebdb.sql:/docker-entrypoint-initdb.d/init.sql:z
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d fovwebdb" ]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: fovwebdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  demo:
    build: ./demo-publisher
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    networks:
      - backend
    environment:
      API_URL: http://backend:4000
      SRT_URL: srt://backend:9999?mode=caller&latency=4000000&rcvbuf=134217728&sndbuf=134217728&peerlatency=4000000&tlpktdrop=0&nakreport=1

  nginx:
    image: nginx:1.31.10-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "4200:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  fov-db:
