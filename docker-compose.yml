services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./backend/media:/var/media
    ports:
      - "4000:4000" # API
      - "9999-10010:9999-10010"
      - "9999-10010:9999-10010/udp" # SRT
    networks:
      - frontend
      - backend
    depends_on:
      moq-relay:
        condition: service_started
      fov-db:
        condition: service_healthy

    environment:
      - PORT=4000
      - DB_HOST=fov-db
      - DB_PORT=5432
      - DB_USER=root
      - SRT_PORT=9999
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=fovwebdb
      - FFMPEG_PATH=/usr/local/bin/ffmpeg
      - MEDIA_ROOT=/var/media
      - SRT_URL=${SRT_URL}
      - API_HOSTNAME=${API_URL}
      - TWITCH_ID=${TWITCH_ID}
      - TWITCH_SECRET=${TWITCH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}

  frontend:
    build:
      context: ./fov-angular

    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:80"
    networks:
      - frontend
    environment:
      - API_URL=http://backend:4000

  fov-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    volumes:
      - fov-db:/var/lib/postgresql
      - ./fovwebdb.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d fovwebdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

    environment:
      POSTGRES_DB: fovwebdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  moq-relay:
    image: moqdev/moq-relay
    restart: unless-stopped
    ports:
      - 0.0.0.0:4443:4443
      - 0.0.0.0:4443:4443/udp
    environment:
      - MOQ_LISTEN_BIND=0.0.0.0:4443
      - MOQ_WEB_HTTP_LISTEN=0.0.0.0:4443
      - MOQ_LISTEN_TLS_GENERATE=localhost # Only for development
      - MOQ_AUTH_PUBLIC='*' # Only for development
      - MOQ_STATS_ENABLED=true

networks:
  frontend:
  backend:
    internal: true

volumes:
  fov-db:
