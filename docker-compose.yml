
services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/media:/var/media
    ports:
      - "4000:4000"   # API
      - "1935:1935"   # RTMP
      - "8000:8000"   # media HTTP (node-media-server)
    restart: unless-stopped

  fov-stack:
    build: .
    ports:
      - 8080:80       # Port interface web
    restart: on-failure
