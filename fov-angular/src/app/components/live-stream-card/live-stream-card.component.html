<article class="live-stream-card">
  <a class="card-thumbnail"
     [routerLink]="['/stream', stream.streamId]"
     [attr.aria-label]="(stream.title ? stream.title : 'Stream de ' + streamerName)
       + ', par ' + streamerName
       + ', en direct, ' + stream.trackCount + ' flux'
       + (stream.viewers > 0 ? ', ' + stream.viewers + ' spectateur' + (stream.viewers > 1 ? 's' : '') : '')">
    <img *ngIf="stream.thumbnailUrl"
         [src]="stream.thumbnailUrl"
         alt=""
         aria-hidden="true"
         class="thumbnail-img">

    <div class="placeholder-thumbnail" *ngIf="!stream.thumbnailUrl" aria-hidden="true">
      <span class="streamer-initial">{{ streamerInitial }}</span>
    </div>

    <div class="live-badge" aria-hidden="true">
      <span class="live-dot"></span>
      EN DIRECT
    </div>
    <div class="track-count" aria-hidden="true">
      <span class="icon">📹</span>
      {{ stream.trackCount }} flux
    </div>
  </a>

  <div class="card-info">
    <div class="card-info-row">
      <a class="avatar-wrapper"
         *ngIf="stream.avatarUrl"
         [routerLink]="['/', streamerRoute]"
         [attr.aria-label]="'Voir le profil de ' + streamerName"
         [title]="'Voir le profil de ' + streamerName">
        <img [src]="stream.avatarUrl" alt="" aria-hidden="true" class="avatar-img">
      </a>
      <a class="avatar-placeholder"
         *ngIf="!stream.avatarUrl"
         [routerLink]="['/', streamerRoute]"
         [attr.aria-label]="'Voir le profil de ' + streamerName"
         [title]="'Voir le profil de ' + streamerName">
        {{ streamerInitial }}
      </a>

      <div class="card-text">
        <a class="streamer-name"
           [routerLink]="['/', streamerRoute]"
           [attr.aria-label]="'Voir le profil de ' + streamerName"
           [title]="'Voir le profil de ' + streamerName">
          {{ streamerName }}
        </a>
        <a class="stream-title"
           *ngIf="stream.title"
           [routerLink]="['/stream', stream.streamId]">
          {{ stream.title }}
        </a>
        <p class="stream-category" *ngIf="stream.category">{{ stream.category }}</p>
        <p class="stream-description" *ngIf="!stream.title && !stream.category">{{ stream.trackCount }} flux vidéo</p>
      </div>
    </div>

    <div class="viewer-count-info" *ngIf="stream.viewers > 0">
      {{ stream.viewers }} spectateur{{ stream.viewers > 1 ? 's' : '' }}
    </div>
  </div>
</article>
