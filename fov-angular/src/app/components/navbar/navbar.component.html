<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo-link">
      <img src="FOVLogo.png" alt="FOV" class="logo">
    </a>
    <div class="nav-links">
      <a routerLink="/followed" routerLinkActive="active">Suivis</a>
      <a routerLink="/discover" routerLinkActive="active">Découvrir</a>
      <a routerLink="/how-does-it-work" routerLinkActive="active">Comment ça marche</a>
    </div>
  </div>
  
  <div class="nav-center">
    <div class="search-container">
      <input type="text" placeholder="Rechercher" class="search-input" autocomplete="off">
      <button class="search-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="nav-right">
    <button class="theme-toggle" (click)="toggleTheme()">
      {{ isDarkTheme ? '☀️' : '🌙' }}
    </button>

    <a *ngIf="isAuthenticated" routerLink="/profile" class="profile-link">
      <div class="profile-avatar">
        <img
          *ngIf="avatarUrl"
          [src]="avatarUrl"
          [alt]="profile?.username || 'Profil'"
          class="avatar-img"
        >
        <span *ngIf="!avatarUrl" class="avatar-initial">{{ initial }}</span>
      </div>
    </a>

    <a *ngIf="!isAuthenticated" routerLink="/login" class="login-link">
      Se connecter
    </a>
  </div>
</nav>
