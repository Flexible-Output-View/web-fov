<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/" class="logo-link">
      <img src="FOVLogo.png" alt="FOV" class="logo">
    </a>
    <div class="nav-links">
      <a routerLink="/followed" routerLinkActive="active">Suivis</a>
      <a routerLink="/discover" routerLinkActive="active">Découvrir</a>
    </div>
  </div>
  
  <div class="nav-center">
    <div class="search-container">
      <input type="text" placeholder="Rechercher" class="search-input">
      <button class="search-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="nav-right">
    <button class="theme-toggle" (click)="toggleTheme()">
      {{ isDarkTheme ? '☀️' : '🌙' }}
    </button>
    <a routerLink="/profile" class="profile-link">
      <div class="profile-avatar">
          <img src="assets/profile-avatar.png" alt="Profil" class="avatar-img">
      </div>
    </a>
  </div>
</nav>
