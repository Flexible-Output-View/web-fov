<nav class="sidebar" [class.collapsed]="isCollapsed">
  
  <div class="sidebar-header">
    <h3 class="section-title" *ngIf="!isCollapsed">En direct</h3>
    
    <button class="sidebar-toggle" (click)="onToggleCollapse()" [title]="isCollapsed ? 'Déplier' : 'Rabattre'">
      <span *ngIf="!isCollapsed">‹</span>
      <span *ngIf="isCollapsed">›</span>
    </button>
  </div>

  <div class="sidebar-section">
    <div *ngIf="liveChannels.length === 0 && !isCollapsed" class="sidebar-empty">
      <span class="empty-text">Aucun live</span>
    </div>
    
    <ul class="channel-list">
      <li *ngFor="let channel of liveChannels" class="channel-item">
        <a [routerLink]="['/stream', channel.streamId]" 
           class="channel-link is-live"
           [title]="isCollapsed ? (channel.streamId + ' - En live') : channel.streamId">
          
          <div class="avatar-circle">{{ channel.streamId.charAt(0).toUpperCase() }}</div>
          
          <div class="channel-info" *ngIf="!isCollapsed">
            <span class="channel-name">{{ channel.streamId }}</span>
            <span class="channel-category">{{ channel.trackCount }} flux</span>
          </div>

          <div class="live-info" *ngIf="!isCollapsed">
            <span class="live-dot"></span>
          </div>
        </a>
      </li>
    </ul>
  </div>
</nav>
