<nav class="sidebar" [class.collapsed]="isCollapsed" aria-label="Chaînes en direct">
  
  <div class="sidebar-header">
    <div class="section-title" *ngIf="!isCollapsed">En direct</div>
    
    <button class="sidebar-toggle"
            (click)="onToggleCollapse()"
            [attr.aria-label]="isCollapsed ? 'Déplier la barre latérale' : 'Rabattre la barre latérale'"
            [attr.aria-expanded]="!isCollapsed">
      <span aria-hidden="true">{{ isCollapsed ? '›' : '‹' }}</span>
    </button>
  </div>

  <div class="sidebar-section">
    <div *ngIf="liveChannels.length === 0 && !isCollapsed" class="sidebar-empty" role="status">
      <span class="empty-text">Aucun live</span>
    </div>
    
    <ul class="channel-list">
      <li *ngFor="let channel of liveChannels" class="channel-item">
        <a [routerLink]="['/stream', channel.streamId]" 
           class="channel-link is-live"
           [attr.aria-label]="isVisuallyCollapsed
             ? ((channel.streamer || channel.streamId) + ', en direct'
                + (channel.viewers > 0 ? ', ' + channel.viewers + ' spectateurs' : ''))
             : null"
           [title]="isVisuallyCollapsed
             ? ((channel.streamer || channel.streamId) + ' - En live')
             : (channel.streamer || channel.streamId)">
          
          <img *ngIf="channel.avatarUrl"
               [src]="channel.avatarUrl"
               alt=""
               aria-hidden="true"
               class="avatar">
          <div class="avatar-circle"
               *ngIf="!channel.avatarUrl"
               aria-hidden="true">
            {{ (channel.streamer || channel.streamId).charAt(0).toUpperCase() }}
          </div>
          
          <div class="channel-info" *ngIf="!isCollapsed">
            <span class="channel-name">{{ channel.streamer || channel.streamId }}</span>
            <span class="channel-category" *ngIf="channel.category">{{ channel.category }}</span>
            <span class="channel-category" *ngIf="!channel.category">{{ channel.trackCount }} flux</span>
          </div>

          <div class="live-info" *ngIf="!isCollapsed">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="sr-only">en direct</span>
            <span class="viewer-count" *ngIf="channel.viewers > 0">
              {{ channel.viewers }}<span class="sr-only"> spectateurs</span>
            </span>
          </div>
        </a>
      </li>
    </ul>
  </div>
</nav>
