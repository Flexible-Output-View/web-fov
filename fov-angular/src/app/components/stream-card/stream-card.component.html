<article class="stream-card" [attr.aria-label]="stream.title + ', par ' + stream.streamer + ', en direct'">
  <div class="stream-thumbnail">
    <img [src]="stream.thumbnail" alt="" aria-hidden="true" class="thumbnail-img">
    <div class="live-indicator" aria-hidden="true">EN DIRECT</div>
    <div class="viewer-count" aria-hidden="true">{{ stream.viewers }} spectateurs</div>
  </div>
  <div class="stream-info">
    <div class="streamer-avatar">
      <img [src]="stream.avatar" alt="" aria-hidden="true">
    </div>
    <div class="stream-details">
      <h4 class="stream-title">{{ stream.title }}</h4>
      <p class="streamer-name">{{ stream.streamer }}</p>
      <p class="stream-category">{{ stream.category }}</p>
    </div>
  </div>
</article>
