<aside class="stream-chat" aria-label="Chat en direct">
  <header class="chat-header">
    <span class="chat-title">CHAT EN DIRECT</span>
    <span
      class="connection-dot"
      [class.online]="isConnected"
      role="status"
      [attr.aria-label]="isConnected ? 'Connecté au chat' : 'Connexion au chat en cours'">
    </span>
  </header>

  <div
    #messagesScroll
    class="chat-messages"
    (scroll)="onScroll()"
    role="log"
    aria-live="polite"
    aria-relevant="additions"
    aria-label="Messages du chat">
    <div class="chat-empty" *ngIf="messages.length === 0">
      <p class="empty-icon" aria-hidden="true">💬</p>
      <p>Bienvenue dans le chat !</p>
      <p class="empty-hint">Soyez le premier à discuter.</p>
    </div>

    <div
      class="chat-line"
      *ngFor="let msg of messages; trackBy: trackByMessage"
      [attr.aria-label]="msg.username + ' dit : ' + msg.message">
      <span class="chat-time" aria-hidden="true">{{ formatTime(msg.createdAt) }}</span>
      <span
        class="chat-username"
        [style.color]="usernameColor(msg.username)"
        >{{ msg.username }}</span
      ><span class="chat-colon" aria-hidden="true">: </span>
      <span class="chat-text">{{ msg.message }}</span>
    </div>
  </div>

  <footer class="chat-footer">
    <div class="send-error" *ngIf="sendError" role="alert">
      {{ sendError }}
    </div>

    <div class="chat-input-row" *ngIf="isLoggedIn; else loginPrompt">
      <label for="chat-message-input" class="sr-only">Message du chat</label>
      <input
        id="chat-message-input"
        class="chat-input"
        type="text"
        [(ngModel)]="draft"
        (keydown)="onKeydown($event)"
        [maxlength]="maxLength"
        [disabled]="isSending"
        placeholder="Envoyer un message"
        aria-label="Écrire un message dans le chat"
        [attr.aria-describedby]="sendError ? 'chat-error' : null"
      />
      <button
        class="chat-send"
        (click)="send()"
        [disabled]="!canSend"
        aria-label="Envoyer le message">
        {{ isSending ? '…' : 'Discuter' }}
      </button>
    </div>
    <div class="chat-count" *ngIf="isLoggedIn" aria-hidden="true">
      {{ draft.length }}/{{ maxLength }}
    </div>

    <ng-template #loginPrompt>
      <div class="login-prompt">
        <p>Connectez-vous pour participer au chat.</p>
        <a routerLink="/login" class="btn-login">Se connecter</a>
      </div>
    </ng-template>
  </footer>
</aside>
