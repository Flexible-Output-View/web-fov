<div *ngIf="!categoryName; else categoryView">
  
  <div class="discover-page">
    <h1>Découvrir</h1>
    <div class="tabs">
      <button class="tab-btn" 
              [class.active]="activeTab === 'categories'" 
              (click)="setActiveTab('categories')">
        Catégories
      </button>
      <button class="tab-btn" 
              [class.active]="activeTab === 'channels'" 
              (click)="setActiveTab('channels')">
        Chaînes live
      </button>
    </div>

    <div class="tab-content">
      <div *ngIf="activeTab === 'categories'">
        <div *ngIf="isLoadingCategories" class="loading-state">
          Chargement des catégories...
        </div>
        <div *ngIf="!isLoadingCategories" class="categories-grid">
          <app-category-card 
            *ngFor="let category of allCategories" 
            [category]="category">
          </app-category-card>
        </div>
      </div>
      
      <div *ngIf="activeTab === 'channels'">
        <div *ngIf="isLoadingStreams" class="loading-state">
          <div class="loading-spinner"></div>
          <span>Recherche des streams en direct...</span>
        </div>
        
        <div *ngIf="!isLoadingStreams && liveStreams.length === 0" class="empty-state">
          <div class="empty-icon">📡</div>
          <p>Aucun stream en direct</p>
        </div>
        
        <div *ngIf="!isLoadingStreams && liveStreams.length > 0" class="live-streams-grid">
          <app-live-stream-card 
            *ngFor="let stream of liveStreams" 
            [stream]="stream">
          </app-live-stream-card>
        </div>
      </div>
    </div>
  </div>

</div>

<ng-template #categoryView>
  <div class="category-page">
    <h1>{{ categoryName }}</h1>
    <p class="no-streams-msg">
      Les streams par catégorie seront disponibles prochainement.
    </p>
  </div>
</ng-template>
