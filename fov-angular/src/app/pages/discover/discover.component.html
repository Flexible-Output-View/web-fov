<div *ngIf="!categoryName; else categoryView">

  <div class="discover-page">
    <h1>Découvrir</h1>

    <div class="tabs" role="tablist" aria-label="Sections de découverte">
      <button role="tab"
              id="discover-tab-categories"
              class="tab-btn"
              [class.active]="activeTab === 'categories'"
              [attr.aria-selected]="activeTab === 'categories'"
              [attr.tabindex]="activeTab === 'categories' ? 0 : -1"
              aria-controls="discover-panel-categories"
              (click)="setActiveTab('categories')">
        Catégories
      </button>
      <button role="tab"
              id="discover-tab-channels"
              class="tab-btn"
              [class.active]="activeTab === 'channels'"
              [attr.aria-selected]="activeTab === 'channels'"
              [attr.tabindex]="activeTab === 'channels' ? 0 : -1"
              aria-controls="discover-panel-channels"
              (click)="setActiveTab('channels')">
        Chaînes live
      </button>
    </div>

    <div class="tab-content">

      <div role="tabpanel"
           id="discover-panel-categories"
           aria-labelledby="discover-tab-categories"
           *ngIf="activeTab === 'categories'">

        <div *ngIf="isLoadingCategories" class="loading-state" role="status" aria-live="polite">
          <span class="loading-spinner" aria-hidden="true"></span>
          Chargement des catégories…
        </div>

        <div *ngIf="!isLoadingCategories" class="categories-grid">
          <app-category-card
            *ngFor="let category of allCategories"
            [category]="category">
          </app-category-card>
        </div>
      </div>

      <div role="tabpanel"
           id="discover-panel-channels"
           aria-labelledby="discover-tab-channels"
           *ngIf="activeTab === 'channels'">

        <div *ngIf="isLoadingStreams" class="loading-state" role="status" aria-live="polite">
          <div class="loading-spinner" aria-hidden="true"></div>
          <span>Recherche des streams en direct…</span>
        </div>

        <div *ngIf="!isLoadingStreams && liveStreams.length === 0" class="empty-state" role="status">
          <div class="empty-icon" aria-hidden="true">📡</div>
          <p>Aucun stream en direct</p>
        </div>

        <div *ngIf="!isLoadingStreams && liveStreams.length > 0" class="live-streams-grid">
          <app-live-stream-card
            *ngFor="let stream of liveStreams"
            [stream]="stream">
          </app-live-stream-card>
        </div>
      </div>

    </div>
  </div>

</div>

<ng-template #categoryView>
  <div class="category-page">
    <h1>{{ categoryName }}</h1>
    <p class="no-streams-msg">
      Les streams par catégorie seront disponibles prochainement.
    </p>
  </div>
</ng-template>
