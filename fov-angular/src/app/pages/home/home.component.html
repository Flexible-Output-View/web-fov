<div class="home-page">
  <section class="section live-section">
    <div class="section-header">
      <h2>
        <span class="live-icon">🔴</span>
        En direct maintenant
      </h2>
      <button class="btn-refresh" (click)="refreshLiveStreams()" [disabled]="isLoadingLiveStreams">
        🔄 Actualiser
      </button>
    </div>
    
    <div *ngIf="isLoadingLiveStreams" class="loading-state">
      <div class="loading-spinner"></div>
      <span>Recherche des streams en direct...</span>
    </div>
    
    <div *ngIf="!isLoadingLiveStreams && liveStreams && liveStreams.length === 0" class="empty-state">
      <div class="empty-icon">📡</div>
      <p>Aucun stream en direct pour le moment</p>
      <span class="empty-hint">Les streams apparaîtront ici dès qu'ils seront lancés</span>
    </div>
    
    <div *ngIf="!isLoadingLiveStreams && liveStreams && liveStreams.length > 0" class="live-streams-grid">
      <app-live-stream-card 
        *ngFor="let stream of liveStreams" 
        [stream]="stream">
      </app-live-stream-card>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>Lives populaires</h2>
    </div>
    <app-featured-carousel></app-featured-carousel>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>Catégories populaires</h2>
    </div>
    
    <div *ngIf="isLoadingCategories" class="loading-state">
      Chargement des catégories...
    </div>
    
    <div *ngIf="!isLoadingCategories" class="categories-grid">
      <app-category-card 
        *ngFor="let category of popularCategories" 
        [category]="category">
      </app-category-card>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>Chaînes que vous pourriez aimer</h2>
    </div>
    <div class="streams-grid">
      <app-stream-card 
        *ngFor="let stream of recommendedStreams" 
        [stream]="stream">
      </app-stream-card>
    </div>
  </section>
</div>
