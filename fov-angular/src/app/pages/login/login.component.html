<div class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <h1>Connexion</h1>
      <p>Connectez-vous à votre compte FOV</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="login">Email ou nom d'utilisateur</label>
        <input
          type="text"
          id="login"
          [(ngModel)]="login"
          name="login"
          placeholder="votre@email.com ou nom d'utilisateur"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Vous n'avez pas de compte ? <a routerLink="/register">Inscrivez-vous</a></p>
    </div>
  </div>
</div>
