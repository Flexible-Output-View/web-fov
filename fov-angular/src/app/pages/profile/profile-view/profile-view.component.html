<div class="profile-page" *ngIf="profile">

  <div class="profile-banner"
       [style.background-image]="profile.bannerUrl ? 'url(' + profile.bannerUrl + ')' : null"
       [class.empty]="!profile.bannerUrl">
  </div>

  <div class="profile-header">
    <div class="avatar">
      <img *ngIf="profile.avatarUrl" [src]="profile.avatarUrl" [alt]="profile.username">
      <span *ngIf="!profile.avatarUrl">{{ profile.username.charAt(0).toUpperCase() }}</span>
    </div>

    <div class="profile-info">
      <h1>{{ profile.username }}</h1>
      <p class="bio" *ngIf="profile.bio">{{ profile.bio }}</p>
      <p class="bio empty" *ngIf="!profile.bio">Aucune biographie pour le moment.</p>

      <div class="profile-actions">
        <button *ngIf="isOwnProfile" class="btn-primary" (click)="goToSettings()">
          Modifier mon profil
        </button>

        <button *ngIf="!isOwnProfile && isAuthenticated"
                class="btn-follow"
                [class.following]="following"
                (click)="toggleFollow()">
          {{ following ? '✓ Abonné' : 'Suivre' }}
        </button>
      </div>
    </div>
  </div>

  <div class="profile-stats">
    <div class="stat">
      <span class="stat-value">{{ profile.followersCount }}</span>
      <span class="stat-label">Abonnés</span>
    </div>
    <div class="stat">
      <span class="stat-value">{{ profile.followingCount }}</span>
      <span class="stat-label">Abonnements</span>
    </div>
  </div>
</div>

<div class="not-found" *ngIf="notFound">
  <h2>Utilisateur introuvable</h2>
  <p>Aucun profil ne correspond à « {{ username }} ».</p>
</div>
